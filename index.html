<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Ant Defenders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .canvas-container {
            position: relative;
            aspect-ratio: 9 / 19.5; /* Phone aspect ratio standard frame */
            max-height: 92vh;
            max-width: 100vw;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div id="gameWrapper" class="canvas-container relative rounded-3xl overflow-hidden border-4 border-slate-700 bg-slate-900 flex items-center justify-center">
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" width="450" height="975" class="w-full h-full object-cover"></canvas>

        <!-- UI Overlay Layer -->
        <div id="uiOverlay" class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">
            
            <!-- Top HUD -->
            <div class="flex justify-between items-center w-full bg-slate-900/80 backdrop-blur-md p-3 rounded-2xl border border-slate-700/50 shadow-lg pointer-events-auto">
                <div class="flex items-center gap-2">
                    <span id="hudCharAvatar" class="w-10 h-10 rounded-full border-2 border-yellow-400 bg-slate-800 flex items-center justify-center overflow-hidden">
                        <!-- Dynamic SVG portrait icon inserted here -->
                    </span>
                    <div>
                        <div id="hudCharName" class="text-xs font-bold text-yellow-400 tracking-wider uppercase">RUMI</div>
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-red-400 font-extrabold">HP:</span>
                            <div class="w-20 bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                <div id="hpBar" class="bg-gradient-to-r from-red-500 to-emerald-400 h-full w-full transition-all duration-300"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-right">
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Defeated</div>
                    <div id="scoreText" class="text-2xl font-black text-white tracking-tight">0</div>
                </div>
            </div>

            <!-- Start / Selection Screen Overlay -->
            <div id="selectScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-lg flex flex-col items-center justify-between p-6 pointer-events-auto z-20">
                <div class="text-center mt-4">
                    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 tracking-wider">NYC ANT DEFENDERS</h1>
                    <p class="text-xs text-slate-400 mt-1 font-medium">Select your hero to protect New York!</p>
                </div>

                <!-- Character Selection Cards -->
                <div class="grid grid-cols-1 gap-3 w-full max-w-xs my-auto">
                    <!-- RUMI CARD -->
                    <button onclick="selectHero('rumi')" id="btn-rumi" class="hero-btn group relative flex items-center p-3 rounded-2xl border-2 border-slate-700 bg-slate-800/80 hover:border-yellow-400 hover:bg-slate-800 transition-all text-left">
                        <div class="w-16 h-16 rounded-xl bg-purple-950 border border-purple-500/30 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-md">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <circle cx="50" cy="50" r="45" fill="#2e1065"/>
                                <!-- Rumi hairstyle preview -->
                                <path d="M 30,55 Q 15,25 40,15 Q 65,10 75,35 Q 85,60 50,85 Z" fill="#9333ea" />
                                <circle cx="35" cy="25" r="14" fill="#a855f7" />
                                <circle cx="48" cy="18" r="16" fill="#c084fc" />
                                <path d="M 40,32 Q 50,28 60,32 Q 55,60 45,60 Z" fill="#fde047" /> <!-- Yellow jacket -->
                                <circle cx="50" cy="42" r="10" fill="#fca5a5"/> <!-- Face -->
                            </svg>
                        </div>
                        <div class="ml-3">
                            <div class="text-base font-black text-yellow-400 group-hover:text-yellow-300">RUMI</div>
                            <div class="text-[11px] text-slate-300 font-medium">Katana Slash • High Speed</div>
                            <div class="text-[10px] text-purple-400 italic">Yellow Jacket & Braided Ponytail</div>
                        </div>
                    </button>

                    <!-- MIRA CARD -->
                    <button onclick="selectHero('mira')" id="btn-mira" class="hero-btn group relative flex items-center p-3 rounded-2xl border-2 border-slate-700 bg-slate-800/80 hover:border-red-400 hover:bg-slate-800 transition-all text-left">
                        <div class="w-16 h-16 rounded-xl bg-red-950 border border-red-500/30 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-md">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <circle cx="50" cy="50" r="45" fill="#450a0a"/>
                                <path d="M 20,20 Q 50,5 80,20 L 85,85 L 15,85 Z" fill="#dc2626"/> <!-- Long Red Hair -->
                                <circle cx="50" cy="42" r="10" fill="#fca5a5"/> <!-- Face -->
                                <path d="M 30,58 Q 50,50 70,58 L 75,90 L 25,90 Z" fill="#c084fc"/> <!-- Sweater -->
                                <!-- Ribbon -->
                                <circle cx="28" cy="22" r="4" fill="#60a5fa"/>
                                <circle cx="72" cy="22" r="4" fill="#60a5fa"/>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <div class="text-base font-black text-red-400 group-hover:text-red-300">MIRA</div>
                            <div class="text-[11px] text-slate-300 font-medium">Spear Thrust • Long Reach</div>
                            <div class="text-[10px] text-pink-400 italic">Twin Pigtails & Bear Sweater</div>
                        </div>
                    </button>

                    <!-- FONA CARD -->
                    <button onclick="selectHero('fona')" id="btn-fona" class="hero-btn group relative flex items-center p-3 rounded-2xl border-2 border-slate-700 bg-slate-800/80 hover:border-cyan-400 hover:bg-slate-800 transition-all text-left">
                        <div class="w-16 h-16 rounded-xl bg-teal-950 border border-teal-500/30 overflow-hidden flex-shrink-0 flex items-center justify-center shadow-md">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <circle cx="50" cy="50" r="45" fill="#042f2e"/>
                                <circle cx="50" cy="40" r="18" fill="#1e1b4b"/> <!-- Dark Hair -->
                                <circle cx="50" cy="42" r="10" fill="#fca5a5"/> <!-- Face -->
                                <path d="M 35,55 Q 50,48 65,55 L 70,90 L 30,90 Z" fill="#0d9488"/> <!-- Teal Top -->
                                <!-- Crystal Fan -->
                                <path d="M 65,30 L 80,15 L 75,35 Z" fill="#c084fc"/>
                                <path d="M 70,35 L 90,25 L 80,45 Z" fill="#60a5fa"/>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <div class="text-base font-black text-cyan-400 group-hover:text-cyan-300">FONA</div>
                            <div class="text-[11px] text-slate-300 font-medium">Crystal Blades • Ranged Attack</div>
                            <div class="text-[10px] text-teal-400 italic">Dark Bun & Teal Crop Top</div>
                        </div>
                    </button>
                </div>

                <button id="startBtn" onclick="startGame()" class="w-full max-w-xs py-4 bg-gradient-to-r from-yellow-400 via-amber-500 to-orange-500 text-slate-950 font-black text-lg rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition-all uppercase tracking-wider">
                    START DEFENDING
                </button>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameOverScreen" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-md flex-col items-center justify-center p-6 text-center pointer-events-auto z-30">
                <h2 class="text-4xl font-black text-red-500 mb-2 tracking-tight">CITY OVERRUN!</h2>
                <p class="text-slate-300 text-sm mb-6">The giant ants overran the crosswalk!</p>
                
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-xs mb-6 shadow-inner">
                    <div class="text-slate-400 text-xs uppercase tracking-widest font-bold">Total Ants Defeated</div>
                    <div id="finalScore" class="text-4xl font-black text-yellow-400 my-1">0</div>
                </div>

                <div class="flex flex-col gap-3 w-full max-w-xs">
                    <button onclick="restartGame()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-base rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all uppercase tracking-wider">
                        PLAY AGAIN
                    </button>
                    <!-- Requested Blue 'Change Character' Button -->
                    <button onclick="showCharSelect()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-base rounded-xl shadow-lg active:scale-95 transition-all uppercase tracking-wider">
                        CHANGE CHARACTER
                    </button>
                </div>
            </div>

            <!-- Tap/Click Attack Prompt at Bottom -->
            <div id="tapInstruction" class="text-center pb-2 opacity-80 pointer-events-none transition-opacity duration-300">
                <span class="bg-black/60 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full border border-white/20 font-bold uppercase tracking-wider shadow-lg">
                    TAP SCREEN TO ATTACK ANTS!
                </span>
            </div>
        </div>
    </div>

    <script>
        // Game Engine State
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let selectedCharacter = 'rumi'; // Default character
        let isPlaying = false;
        let score = 0;
        let playerHp = 100;
        let animationFrameId = null;
        let lastAntSpawnTime = 0;
        let antSpawnInterval = 1800; // ms
        let gameTime = 0;

        // Entities
        let player = null;
        let ants = [];
        let projectiles = [];
        let particles = [];

        // Audio Context (Web Audio API)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound Synthesis helper
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'slash') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'thrust') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crystal') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'damage') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        // Speech Synthesis for score numeric announcement
        function speakScore(numericVal) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop prior audio queue
                const utterance = new SpeechSynthesisUtterance(numericVal.toString());
                utterance.rate = 1.3;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function selectHero(heroKey) {
            selectedCharacter = heroKey;
            document.querySelectorAll('.hero-btn').forEach(btn => {
                btn.classList.remove('border-yellow-400', 'border-red-400', 'border-cyan-400', 'bg-slate-700/80');
            });
            const activeBtn = document.getElementById(`btn-${heroKey}`);
            if (heroKey === 'rumi') activeBtn.classList.add('border-yellow-400', 'bg-slate-700/80');
            if (heroKey === 'mira') activeBtn.classList.add('border-red-400', 'bg-slate-700/80');
            if (heroKey === 'fona') activeBtn.classList.add('border-cyan-400', 'bg-slate-700/80');

            updateAvatarHUD();
        }

        function updateAvatarHUD() {
            const avatarContainer = document.getElementById('hudCharAvatar');
            const nameContainer = document.getElementById('hudCharName');

            if (selectedCharacter === 'rumi') {
                nameContainer.innerText = "RUMI";
                nameContainer.className = "text-xs font-bold text-yellow-400 tracking-wider uppercase";
                avatarContainer.style.borderColor = "#facc15";
                avatarContainer.innerHTML = `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 20,20 Q 50,0 80,20 Q 80,70 50,90 Z" fill="#a855f7"/><circle cx="50" cy="40" r="15" fill="#fca5a5"/></svg>`;
            } else if (selectedCharacter === 'mira') {
                nameContainer.innerText = "MIRA";
                nameContainer.className = "text-xs font-bold text-red-400 tracking-wider uppercase";
                avatarContainer.style.borderColor = "#f87171";
                avatarContainer.innerHTML = `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 20,20 L 80,20 L 80,80 L 20,80 Z" fill="#dc2626"/><circle cx="50" cy="40" r="15" fill="#fca5a5"/></svg>`;
            } else {
                nameContainer.innerText = "FONA";
                nameContainer.className = "text-xs font-bold text-cyan-400 tracking-wider uppercase";
                avatarContainer.style.borderColor = "#22d3ee";
                avatarContainer.innerHTML = `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="40" r="22" fill="#1e1b4b"/><circle cx="50" cy="40" r="15" fill="#fca5a5"/></svg>`;
            }
        }

        function drawRumi(ctx, x, y, frame, isAttacking) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(0, 5, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Legs / Trousers (Black)
            ctx.fillStyle = "#1e1b4b";
            ctx.beginPath();
            ctx.fillRect(-12, -30, 8, 30); // Left Leg
            ctx.fillRect(4, -30, 8, 30);  // Right Leg

            // White Cropped Top
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-10, -50, 20, 18);

            // Silver Necklace
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -48, 6, 0, Math.PI);
            ctx.stroke();

            // Vibrant Yellow Bomber Jacket with patterned details
            ctx.fillStyle = "#facc15"; // Yellow
            // Left sleeve & body
            ctx.fillRect(-16, -52, 8, 22);
            ctx.fillRect(-10, -52, 6, 20);
            // Right sleeve
            ctx.fillRect(10, -52, 8, 22);
            // Red/Black embroidered patches details
            ctx.fillStyle = "#dc2626";
            ctx.fillRect(-15, -48, 5, 8);
            ctx.fillStyle = "#000000";
            ctx.fillRect(12, -48, 5, 8);

            // Head & Face
            ctx.fillStyle = "#fde047"; // Skin tone / highlight
            ctx.fillStyle = "#fca5a5"; // Warm tone
            ctx.beginPath();
            ctx.arc(0, -62, 11, 0, Math.PI * 2);
            ctx.fill();

            // Face details (eyes)
            ctx.fillStyle = "#000";
            ctx.fillRect(3, -64, 3, 2);

            // Purple Voluminous Braided Hair Ponytail
            ctx.fillStyle = "#9333ea";
            // Hair Base
            ctx.beginPath();
            ctx.arc(-2, -66, 12, 0, Math.PI * 2);
            ctx.fill();
            // Large voluminous braided ponytail trailing back/up
            let pTime = Math.sin(frame * 0.1) * 3;
            ctx.fillStyle = "#a855f7";
            ctx.beginPath();
            ctx.arc(-16 + pTime, -72, 10, 0, Math.PI * 2);
            ctx.arc(-26 + pTime, -68, 8, 0, Math.PI * 2);
            ctx.arc(-34 + pTime, -60, 6, 0, Math.PI * 2);
            ctx.fill();

            // Sword / Katana Weapon
            ctx.save();
            ctx.translate(6, -45);
            if (isAttacking) {
                // Slash motion
                ctx.rotate(Math.PI / 4 + Math.sin(frame * 0.5) * 0.8);
                // Slash Arc Visual
                ctx.strokeStyle = "rgba(250, 204, 21, 0.8)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 45, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            } else {
                ctx.rotate(-Math.PI / 6);
            }
            // Katana Blade
            ctx.fillStyle = "#cbd5e1";
            ctx.fillRect(0, -4, 40, 4);
            // Katana Handle
            ctx.fillStyle = "#7e22ce";
            ctx.fillRect(-10, -5, 10, 6);
            // Guard
            ctx.fillStyle = "#facc15";
            ctx.fillRect(-1, -8, 3, 12);
            ctx.restore();

            ctx.restore();
        }

        function drawMira(ctx, x, y, frame, isAttacking) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(0, 5, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Long Vibrant Red Hair Background (Flowing down back)
            ctx.fillStyle = "#dc2626";
            ctx.beginPath();
            ctx.fillRect(-16, -70, 32, 50);

            // Legs
            ctx.fillStyle = "#fca5a5";
            ctx.fillRect(-10, -25, 7, 25);
            ctx.fillRect(3, -25, 7, 25);

            // Light Purple / Lavender Bear Sweater
            ctx.fillStyle = "#c084fc";
            ctx.fillRect(-14, -52, 28, 30);
            // Cute Grumpy Bear Face on Sweater
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(0, -38, 8, 0, Math.PI * 2);
            ctx.fill();
            // Grumpy Bear eyes & Pink Bow
            ctx.fillStyle = "#000000";
            ctx.fillRect(-4, -40, 3, 2);
            ctx.fillRect(1, -40, 3, 2);
            ctx.fillStyle = "#f472b6"; // Pink bow
            ctx.beginPath();
            ctx.arc(5, -44, 3, 0, Math.PI * 2);
            ctx.fill();

            // Head & Fierce Expression
            ctx.fillStyle = "#fca5a5";
            ctx.beginPath();
            ctx.arc(0, -60, 10, 0, Math.PI * 2);
            ctx.fill();
            // Fierce angled eyebrows
            ctx.strokeStyle = "#7f1d1d";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, -64);
            ctx.lineTo(-1, -61);
            ctx.moveTo(5, -64);
            ctx.lineTo(1, -61);
            ctx.stroke();

            // Red Twin Pigtails with Blue Ribbons
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(-14, -68, 7, 0, Math.PI * 2);
            ctx.arc(14, -68, 7, 0, Math.PI * 2);
            ctx.fill();
            // Blue ribbons
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(-16, -69, 5, 4);
            ctx.fillRect(11, -69, 5, 4);

            // Spear Weapon (Pokes / Thrusts horizontally)
            ctx.save();
            let thrustOffset = isAttacking ? Math.sin(frame * 0.6) * 35 + 20 : 0;
            ctx.translate(thrustOffset, -40);
            // Shaft
            ctx.fillStyle = "#78350f";
            ctx.fillRect(-20, -2, 70, 4);
            // Spear Tip
            ctx.fillStyle = "#e2e8f0";
            ctx.beginPath();
            ctx.moveTo(50, -6);
            ctx.lineTo(68, 0);
            ctx.lineTo(50, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function drawFona(ctx, x, y, frame, isAttacking) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(0, 5, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Legs in Gold-trimmed dark pants
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(-11, -30, 9, 30);
            ctx.fillRect(2, -30, 9, 30);
            // Gold trim
            ctx.fillStyle = "#eab308";
            ctx.fillRect(-11, -30, 9, 3);
            ctx.fillRect(2, -30, 9, 3);

            // Teal / Cyan Leather Crop Top with Strap
            ctx.fillStyle = "#0d9488";
            ctx.fillRect(-11, -50, 22, 18);
            // Strap
            ctx.strokeStyle = "#115e59";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10, -50);
            ctx.lineTo(8, -32);
            ctx.stroke();

            // Head & Skin
            ctx.fillStyle = "#fca5a5";
            ctx.beginPath();
            ctx.arc(0, -60, 10, 0, Math.PI * 2);
            ctx.fill();

            // Dark Purple/Black Hair with fringe bangs & side bun
            ctx.fillStyle = "#1e1b4b";
            ctx.beginPath();
            ctx.arc(0, -64, 11, Math.PI, 0); // Top coverage / Bangs
            ctx.fill();
            // Side Bun
            ctx.beginPath();
            ctx.arc(12, -62, 6, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Crystal Blades fan handheld
            ctx.save();
            ctx.translate(10, -42);
            if (isAttacking) {
                ctx.rotate(-Math.PI / 8);
            }
            // Draw handheld crystal fan
            ctx.fillStyle = "#a855f7";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(15, -20);
            ctx.lineTo(22, -10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(22, -10);
            ctx.lineTo(20, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function drawNYCBackground(ctx, width, height) {
            // Bright Daytime Blue Sky
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height * 0.6);
            skyGradient.addColorStop(0, '#38bdf8');
            skyGradient.addColorStop(1, '#bae6fd');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            // Empire State style skyscraper & NYC Skyline
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(width * 0.4, height * 0.1, width * 0.2, height * 0.5); // Main spire tower
            ctx.fillStyle = '#64748b';
            ctx.fillRect(width * 0.46, height * 0.02, width * 0.08, height * 0.08); // Spire tip
            ctx.fillRect(width * 0.1, height * 0.25, width * 0.25, height * 0.35); // Left building
            ctx.fillRect(width * 0.68, height * 0.2, width * 0.25, height * 0.4); // Right building

            // Windows on distant buildings
            ctx.fillStyle = '#fef08a';
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(width * 0.42 + i * 12, height * 0.15 + j * 20, 6, 10);
                    }
                }
            }

            // Brick Buildings Foreground (Sides)
            ctx.fillStyle = '#b91c1c'; // Red brick
            ctx.fillRect(0, height * 0.4, width * 0.18, height * 0.3);
            ctx.fillRect(width * 0.82, height * 0.4, width * 0.18, height * 0.3);

            // Yellow NYC Taxi in background street
            ctx.fillStyle = '#facc15';
            ctx.fillRect(width * 0.65, height * 0.52, 70, 25);
            ctx.fillStyle = '#1e293b'; // Taxi roof/windows
            ctx.fillRect(width * 0.68, height * 0.46, 35, 12);
            ctx.fillStyle = '#000'; // Wheels
            ctx.beginPath();
            ctx.arc(width * 0.68, height * 0.57, 7, 0, Math.PI * 2);
            ctx.arc(width * 0.78, height * 0.57, 7, 0, Math.PI * 2);
            ctx.fill();

            // Asphalt Street Road & Crosswalk
            const roadY = height * 0.58;
            ctx.fillStyle = '#334155'; // Asphalt
            ctx.fillRect(0, roadY, width, height - roadY);

            // Crosswalk White Stripes
            ctx.fillStyle = '#f8fafc';
            for (let x = 20; x < width; x += 60) {
                ctx.fillRect(x, roadY + 40, 35, height - roadY - 50);
            }
        }

        function drawAnt(ctx, ant) {
            ctx.save();
            ctx.translate(ant.x, ant.y);

            // Ant facing left towards player
            let legWiggle = Math.sin(ant.animFrame * 0.3) * 4;

            // Legs
            ctx.strokeStyle = "#451a03";
            ctx.lineWidth = 2;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 8, 0);
                ctx.lineTo(i * 10 - 4, 12 + (i % 2 === 0 ? legWiggle : -legWiggle));
                ctx.stroke();
            }

            // Body Segments (Brown / Black giant ant)
            ctx.fillStyle = "#27272a";
            // Abdomen (rear)
            ctx.beginPath();
            ctx.ellipse(14, -4, 12, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            // Thorax (middle)
            ctx.fillStyle = "#3f3f46";
            ctx.beginPath();
            ctx.ellipse(0, -2, 7, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head (front)
            ctx.fillStyle = "#18181b";
            ctx.beginPath();
            ctx.ellipse(-12, -2, 8, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Red Eye
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(-14, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Antennae
            ctx.strokeStyle = "#18181b";
            ctx.beginPath();
            ctx.moveTo(-16, -6);
            ctx.lineTo(-24, -14 + legWiggle);
            ctx.stroke();

            ctx.restore();
        }

        function drawCrystalProjectile(ctx, proj) {
            ctx.save();
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.angle);

            // Glowing low-flying crystal blade
            ctx.fillStyle = "#38bdf8";
            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, -6);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-10, 6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        class PlayerHero {
            constructor(characterKey) {
                this.key = characterKey;
                this.x = 80;
                this.y = canvas.height * 0.72;
                this.isAttacking = false;
                this.attackTimer = 0;
                this.frame = 0;
            }

            attack() {
                this.isAttacking = true;
                this.attackTimer = 15; // frames duration

                if (this.key === 'rumi') {
                    playSound('slash');
                    // Melee slash hit checking
                    checkMeleeHit(110);
                } else if (this.key === 'mira') {
                    playSound('thrust');
                    // Long spear reach hit checking
                    checkMeleeHit(160);
                } else if (this.key === 'fona') {
                    playSound('crystal');
                    // Spawn low-flying crystal projectile directly aimed at ants
                    projectiles.push({
                        x: this.x + 20,
                        y: this.y - 35,
                        speed: 12,
                        angle: 0
                    });
                }
            }

            update() {
                this.frame++;
                if (this.isAttacking) {
                    this.attackTimer--;
                    if (this.attackTimer <= 0) {
                        this.isAttacking = false;
                    }
                }
            }

            draw(ctx) {
                if (this.key === 'rumi') drawRumi(ctx, this.x, this.y, this.frame, this.isAttacking);
                else if (this.key === 'mira') drawMira(ctx, this.x, this.y, this.frame, this.isAttacking);
                else drawFona(ctx, this.x, this.y, this.frame, this.isAttacking);
            }
        }

        function checkMeleeHit(reachRange) {
            for (let i = ants.length - 1; i >= 0; i--) {
                let ant = ants[i];
                if (ant.x - player.x <= reachRange && ant.x > player.x - 20) {
                    // Defeat Ant
                    createParticles(ant.x, ant.y);
                    ants.splice(i, 1);
                    score++;
                    updateScoreDisplay();
                    playSound('hit');
                    speakScore(score); // Web speech API numeric value announcement
                }
            }
        }

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: '#ef4444'
                });
            }
        }

        function spawnAnt() {
            // Crawl right to left towards player on road
            ants.push({
                x: canvas.width + 30,
                y: canvas.height * 0.72 + (Math.random() * 20 - 10),
                speed: 2.2 + Math.random() * 1.5 + (score * 0.05),
                animFrame: Math.floor(Math.random() * 100)
            });
        }

        function updateScoreDisplay() {
            document.getElementById('scoreText').innerText = score;
        }

        function updateHPDisplay() {
            const hpBar = document.getElementById('hpBar');
            hpBar.style.width = Math.max(0, playerHp) + '%';
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Environment
            drawNYCBackground(ctx, canvas.width, canvas.height);

            // Spawn Ants
            if (timestamp - lastAntSpawnTime > antSpawnInterval) {
                spawnAnt();
                lastAntSpawnTime = timestamp;
                // Gradually increase speed/rate
                if (antSpawnInterval > 700) antSpawnInterval -= 20;
            }

            // Update & Draw Player Hero
            player.update();
            player.draw(ctx);

            // Update & Draw Projectiles (Fona)
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.speed;
                drawCrystalProjectile(ctx, p);

                // Collision with ants
                for (let j = ants.length - 1; j >= 0; j--) {
                    let ant = ants[j];
                    let dist = Math.hypot(p.x - ant.x, p.y - ant.y);
                    if (dist < 25) {
                        createParticles(ant.x, ant.y);
                        ants.splice(j, 1);
                        projectiles.splice(i, 1);
                        score++;
                        updateScoreDisplay();
                        playSound('hit');
                        speakScore(score);
                        break;
                    }
                }

                if (p && p.x > canvas.width + 50) {
                    projectiles.splice(i, 1);
                }
            }

            // Update & Draw Ants
            for (let i = ants.length - 1; i >= 0; i--) {
                let ant = ants[i];
                ant.x -= ant.speed;
                ant.animFrame++;
                drawAnt(ctx, ant);

                // Reached Player (Damage player)
                if (ant.x <= player.x + 15) {
                    ants.splice(i, 1);
                    playerHp -= 15;
                    updateHPDisplay();
                    playSound('damage');

                    if (playerHp <= 0) {
                        gameOver();
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                ctx.fill();

                if (pt.life <= 0) particles.splice(i, 1);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            document.getElementById('selectScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('flex');

            score = 0;
            playerHp = 100;
            ants = [];
            projectiles = [];
            particles = [];
            antSpawnInterval = 1800;
            updateScoreDisplay();
            updateHPDisplay();

            player = new PlayerHero(selectedCharacter);
            isPlaying = true;
            lastAntSpawnTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isPlaying = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('flex');
        }

        function restartGame() {
            startGame();
        }

        function showCharSelect() {
            isPlaying = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('flex');
            document.getElementById('selectScreen').classList.remove('hidden');
        }

        // Tap/Click Attack Listener
        const gameWrapper = document.getElementById('gameWrapper');
        gameWrapper.addEventListener('pointerdown', (e) => {
            if (isPlaying && player) {
                player.attack();
            }
        });

        // Initialize display
        selectHero('rumi');
    </script>
</body>
</html>
